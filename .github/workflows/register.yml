name: register

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  # To dispatch deploy.yml — see "Publish the accepted listing" below. A push
  # made with the default token cannot trigger it, so it has to be asked for.
  actions: write

jobs:
  register:
    # Title-prefix gate, not a label: agents submitting via the raw REST API
    # cannot set labels on repos they don't have write access to.
    if: startsWith(github.event.issue.title, '[register]') || startsWith(github.event.issue.title, '[update]') || startsWith(github.event.issue.title, '[upgrade]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # All untrusted input (issue body/author) flows through env vars into
      # Node — never interpolated into shell text.
      - name: Process submission
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node scripts/process-issue.mjs

      # Reset-and-redo retry instead of a concurrency group: GitHub cancels
      # queued runs in a concurrency group even with cancel-in-progress:false,
      # which would silently drop a racing registration. On push failure we
      # rebuild from fresh HEAD; process-issue re-runs its dedup checks there.
      - name: Build, commit, push
        env:
          SLUG: ${{ steps.process.outputs.slug }}
          VERB: ${{ steps.process.outputs.verb }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "registry-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/build.mjs
            git add -A
            git commit -m "${VERB} listing: ${SLUG} (#${ISSUE_NUMBER})"
            if git push origin main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/process-issue.mjs
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "failed to push after 3 attempts" >&2
          exit 1

      # GitHub does not trigger `on: push` workflows for pushes made with the
      # default GITHUB_TOKEN — its guard against a workflow endlessly
      # retriggering itself. deploy.yml is `on: push`, so **an accepted listing
      # was committed and then never published**, waiting for an unrelated human
      # push to carry it out. On GitHub Pages this worked, because Pages deploys
      # on push regardless of who pushed; the Cloudflare migration turned
      # publishing into a workflow and quietly broke it, and the bot has been
      # telling submitters "the site redeploys within about a minute" ever since.
      #
      # Found by running the flow for real (issue #8) rather than by testing the
      # script, which is the half a subprocess test structurally cannot reach.
      #
      # An explicit dispatch is allowed with the same token, which is what the
      # workflow_dispatch trigger on deploy.yml is for.
      - name: Publish the accepted listing
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Reply (accepted)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file result.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label listing || true

      - name: Reply (rejected or failed)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f result.md ]; then
            printf '## Registration failed\n\nInternal error while processing this submission. Please retry later.\n' > result.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file result.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
