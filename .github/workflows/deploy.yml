name: deploy

# Publishes the committed static build plus the Worker to Cloudflare.
# Runs after normal pushes, explicit health-workflow dispatches, and manual runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Two commits deep so the IndexNow step can ask git what this push
      # changed. The default shallow clone has no parent to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Explicit glob rather than `--test scripts/`: Node 22 resolves a bare
      # directory argument as a module and fails before running anything.
      - name: Validate listings and tests
        run: node --test scripts/*.test.mjs

      # The build is deterministic and its output is committed, so a diff here
      # means someone hand-edited a generated file — deploy the source of
      # truth, never a drifted artifact.
      - name: Verify the committed build is current
        run: |
          node scripts/build.mjs
          if ! git diff --exit-code --stat; then
            echo "::error::committed build is stale — run 'node scripts/build.mjs' and commit the result"
            exit 1
          fi

      # Until the Cloudflare secrets exist there is nothing to deploy to.
      # Skipping keeps main green and says why, instead of a red X on every
      # push that everyone learns to ignore.
      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see DEPLOY.md, Phase 1)."
          fi

      # Deliberately `npx wrangler@4` rather than cloudflare/wrangler-action@v3:
      # the action pins a wrangler whose esbuild cannot parse import attributes
      # (`import cfg from '...json' with { type: 'json' }` in worker/index.js) and
      # rejects `run_worker_first` in [assets] as an unknown field. Both are valid
      # current config; the action's wrangler is simply too old. This is also the
      # same invocation cf-admin.yml uses, so one wrangler version covers both.
      - name: Deploy to Cloudflare
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # Tell Bing/Yandex/Seznam what changed, once it is actually live. Only
      # pages this push touched are submitted, and only ones the sitemap
      # publishes — see scripts/indexnow.mjs. `|| true` is belt and braces on
      # top of the script's own catch: a search-engine ping must never be the
      # reason a deploy reports failure.
      - name: Announce changed pages to IndexNow
        if: steps.creds.outputs.ready == 'true'
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            node scripts/indexnow.mjs $CHANGED || true
          else
            echo "indexnow: no diff against the previous commit — nothing to announce"
          fi

      - name: Open deployment-failure incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Deployment failure'
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq "map(select(.title == \"$title\")) | length")
          if [ "$open" -eq 0 ]; then
            {
              echo "Cloudflare deployment failed for commit \`$GITHUB_SHA\` on branch \`$GITHUB_REF_NAME\`."
              echo
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo "Check the run logs for test, build, or wrangler deployment errors."
            } > /tmp/deploy-incident.md
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file /tmp/deploy-incident.md
          fi

      - name: Close recovered deployment incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq '.[] | select(.title == "Deployment failure") | .number' |
          while read -r issue; do
            [ -n "$issue" ] && gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "Deployment recovered in workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          done
