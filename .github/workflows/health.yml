name: health

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Re-check every listing URL
        id: check
        run: node scripts/check-liveness.mjs

      # Grades for the score badge. Runs after the liveness pass so a delisted
      # product is not scored, and never fails the job: a scoring hiccup must not
      # block a delisting, and last week's grade is kept rather than blanked.
      - name: Re-score every listing
        id: score
        continue-on-error: true
        run: node scripts/score-listings.mjs

      # One dated traffic reading appended per run, so /report.html can quote a
      # figure that stays the same figure when someone checks it later, and so
      # the trend is readable at all. The script refuses to write when the stats
      # endpoint is unavailable or unauthenticated rather than overwriting a good
      # history with a zero, so this loses a data point at worst, never the series.
      - name: Snapshot the traffic reading
        id: traffic
        continue-on-error: true
        run: node scripts/snapshot-traffic.mjs

      # A missing snapshot used to be silent because the last good series was
      # deliberately preserved. Preserve it still, but make the outage visible:
      # one durable issue while stats are down, closed automatically on recovery.
      - name: Open traffic-stats incident
        if: steps.traffic.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Traffic stats unavailable'
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq "map(select(.title == \"$title\")) | length")
          if [ "$open" -eq 0 ]; then
            {
              echo "The weekly traffic snapshot could not read https://index.percall.dev/api/stats.json."
              echo
              echo "No zero was written: api/traffic.json still contains the last verified reading."
              echo "Repair the Cloudflare Analytics Read token, push the Worker secret, then re-run this workflow."
              echo
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/traffic-stats-incident.md
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file /tmp/traffic-stats-incident.md
          fi

      - name: Close recovered traffic-stats incident
        if: steps.traffic.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title --jq '.[] | select(.title == "Traffic stats unavailable") | .number' |
          while read -r issue; do
            [ -n "$issue" ] && gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "The traffic snapshot succeeded in workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          done

      # Honour existing prepaid watches after purchase retirement: probe, spend a credit, and
      # POST the subscriber's webhook when the state *changed*. Deliberately not
      # a Cloudflare cron trigger — `wrangler deploy` applies triggers as one
      # phase and a trigger it cannot apply takes the whole deployment down,
      # which has happened here once. This job already runs at the cadence the
      # product promises, so reusing it costs nothing and cannot break a deploy.
      #
      # continue-on-error: a missed sweep delays an alert by a week. A failed
      # health run would stop the catalog refresh and the liveness probe too,
      # which is a worse outcome than a late webhook.
      - name: Finish existing prepaid watches
        continue-on-error: true
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -z "${DASHBOARD_TOKEN:-}" ]; then
            echo "::notice::DASHBOARD_TOKEN not set — skipping the watch sweep"
            exit 0
          fi
          code=$(curl -sS -o /tmp/sweep.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DASHBOARD_TOKEN" \
            https://router.percall.dev/api/watch/sweep)
          echo "HTTP $code"
          cat /tmp/sweep.json
          test "$code" = 200

      # The x402 catalog is a mirror, so it goes stale on its own. Refreshed
      # here rather than on its own schedule because it commits alongside the
      # other weekly state, and the output is sorted by URL so the diff is the
      # week's actual churn rather than a 15k-line rewrite. continue-on-error:
      # an upstream hiccup should leave last week's catalog standing, not fail
      # the liveness run.
      - name: Refresh the x402 endpoint catalog
        id: catalog
        continue-on-error: true
        run: node scripts/fetch-x402-catalog.mjs

      - name: Refresh the remote-MCP-server catalog
        id: mcp-catalog
        continue-on-error: true
        run: node scripts/fetch-mcp-catalog.mjs

      # Bazaar cataloging is CDP-side and gives no signal when it happens, so
      # the weekly run watches for it rather than leaving it to be remembered.
      # Never fails the job: not being listed is the status quo, not a fault.
      - name: Are we in the x402 Bazaar yet?
        continue-on-error: true
        run: node scripts/bazaar-check.mjs

      # Neither upstream registry checks whether its entries still answer, so an
      # unknown share of ~24,700 endpoints are dead. Probes a rotating sample —
      # every stride-th row, cursor advancing one per run — so each week is a
      # spread sample of the whole catalog and a full pass completes over time.
      # Runs last because it is the slowest step and the least important: it
      # enriches the catalogs rather than producing them. continue-on-error for
      # the same reason as the refreshes above — a flaky network on our side
      # must not cost the week's liveness and scoring work.
      - name: Probe a rotating sample of both catalogs
        continue-on-error: true
        run: node scripts/probe-catalogs.mjs

      # No longer gated on the liveness/score steps reporting a change: the
      # catalog refresh also produces one and has no such flag, so the gate is
      # now "did anything actually change on disk", asked of git rather than
      # inferred from step outputs.
      - name: Commit health state / delistings / catalog
        id: commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name "registry-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/build.mjs
            git add -A
            if git diff --cached --quiet; then
              echo "::notice::nothing changed this week"
              exit 0
            fi
            git commit -m "Weekly check: liveness, agent-readability scores, x402 catalog"
            if git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/check-liveness.mjs
            node scripts/score-listings.mjs || true
            node scripts/fetch-x402-catalog.mjs || true
            node scripts/fetch-mcp-catalog.mjs || true
            sleep $(( (RANDOM % 5) + 2 ))
          done
          exit 1

      # Pushes made with GITHUB_TOKEN do not trigger push-based workflows.
      # Explicitly dispatch the deploy after this job has refreshed main so the
      # newly committed report, scores, and catalogs reach production.
      - name: Deploy refreshed health state
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Open report issue
        if: steps.check.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Liveness report $(date -u +%Y-%m-%d)" \
            --body-file health-report.md
