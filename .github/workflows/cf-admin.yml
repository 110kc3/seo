name: cf-admin

# Manually-triggered Cloudflare admin commands, for the account operations that
# need the API token. The token lives only as a repo secret, so these cannot be
# run from a developer machine without copying it around — which is the point.
#
# Run with: gh workflow run cf-admin -f action=kv-setup
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: kv-setup
        type: choice
        options:
          - kv-setup      # ensure the PAYMENTS KV namespace exists, print its id
          - whoami        # show what the token is allowed to do
          - subdomain     # print the account's workers.dev subdomain
          - push-secrets  # copy managed repo secrets to the Worker
          - stats-probe   # can the deploy token read Analytics Engine?
          - stats-funnel  # who hits the paid endpoint? client type x path bucket
          - traffic-report # aggregate RUM + edge traffic for one hostname
          - verify-cdp    # check the CDP rail using the CDP credentials
          - robots-report # read the managed-robots.txt setting on every zone
          - robots-allow  # stop Cloudflare injecting AI-crawler Disallow rules
          - attach-domain # attach `hostname` to the Worker as a custom domain
          - pages-setup   # create a Git-backed Pages project and attach `hostname`
      hostname:
        description: Hostname for traffic-report, attach-domain or pages-setup
        required: false
        default: ""
        type: string
      days:
        description: UTC lookback in whole days (1-7) for traffic-report
        required: false
        default: "7"
        type: string
      project_name:
        description: New Pages project name for pages-setup
        required: false
        default: ""
        type: string
      source_project:
        description: Existing Pages project whose Git connection should be reused
        required: false
        default: ""
        type: string
      root_dir:
        description: Repository directory to publish as the Pages site root
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: whoami
        if: inputs.action == 'whoami'
        run: npx --yes wrangler@4 whoami

      # Worker secrets cannot be set from a laptop without the API token on it, and
      # they must never be echoed. Piping a repo secret straight into `wrangler
      # secret put` keeps the value inside the runner: it is never a command
      # argument, never in a log, and never in the repo.
      - name: Push managed secrets to the Worker
        if: inputs.action == 'push-secrets'
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
        run: |
          set -u
          pushed=0
          for name in DASHBOARD_TOKEN SIGNING_KEY CF_ANALYTICS_TOKEN CDP_API_KEY_ID CDP_API_KEY_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::notice::repo secret $name is not set — skipping"
              continue
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            pushed=$((pushed + 1))
          done

          # The account id is not secret and is already a repo secret for deploys;
          # /api/stats.json reads it as CF_ACCOUNT_ID, so mirror it rather than
          # asking for the same value twice.
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4 secret put CF_ACCOUNT_ID

          # Analytics fallback. The deploy token turns out to satisfy Account
          # Analytics: Read (verified with `stats-probe`), so stats can publish
          # today instead of waiting on a second token.
          #
          # It is NOT the right long-term credential: it also carries Workers
          # Scripts: Edit, so a bug that ever exposed the Worker's env would hand
          # over deploy rights to the account. Create a token with ONLY
          # Account Analytics: Read, set it as repo secret CF_ANALYTICS_TOKEN, and
          # re-run this action — the mirror below then stops on its own.
          if [ -z "$CF_ANALYTICS_TOKEN" ]; then
            echo "::warning::mirroring the deploy token into CF_ANALYTICS_TOKEN — over-privileged, replace with an Account Analytics: Read token"
            printf '%s' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4 secret put CF_ANALYTICS_TOKEN
          fi
          echo "::notice::pushed $pushed managed secret(s) plus CF_ACCOUNT_ID"
          echo "--- secrets now on the Worker ---"
          npx --yes wrangler@4 secret list

      # `/api/stats.json` publishes client type and path bucket as two separate
      # totals, which cannot answer the only question that matters about the
      # paywall: of the requests that met a 402, how many came from something
      # that could conceivably pay? A crawler with no wallet and a scripted
      # client with one are the same row in the public feed. The cross is in the
      # dataset already — this reads it, and nothing else. Read-only.
      - name: Who actually reaches the paid endpoint
        if: inputs.action == 'stats-funnel'
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          token="${CF_ANALYTICS_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" \
            -H "Authorization: Bearer $token" \
            -H 'content-type: text/plain' \
            --data "SELECT blob1 AS path_bucket, blob2 AS client_type, blob4 AS status_class,
                      SUM(_sample_interval) AS requests
                    FROM ai_product_index_requests
                    WHERE timestamp > NOW() - INTERVAL '30' DAY
                      AND blob1 IN ('audit', 'score_free', 'x402_info')
                    GROUP BY path_bucket, client_type, status_class
                    ORDER BY path_bucket, requests DESC
                    LIMIT 100" \
          | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const rows = (JSON.parse(s).data) || [];
                if (!rows.length) return console.log("no rows — check the token has Account Analytics: Read");
                console.log("path".padEnd(12), "client".padEnd(14), "status".padEnd(8), "requests");
                for (const r of rows) {
                  console.log(
                    String(r.path_bucket).padEnd(12),
                    String(r.client_type).padEnd(14),
                    String(r.status_class).padEnd(8),
                    r.requests,
                  );
                }
              });'

      # Web Analytics counts browser page loads; zone HTTP analytics counts all
      # requests reaching the edge. Reading both is the difference between
      # "traffic exists" and "people are landing on this tool page". The script
      # requests grouped rows only: never IPs, raw user agents, query strings or
      # individual events. Its JSON/Markdown artifact expires after 14 days.
      - name: Report aggregate traffic for one hostname
        if: inputs.action == 'traffic-report'
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          TRAFFIC_HOSTNAME: ${{ inputs.hostname }}
          TRAFFIC_DAYS: ${{ inputs.days }}
          TRAFFIC_REPORT_DIR: ${{ runner.temp }}/traffic-report
        run: node scripts/cloudflare-traffic-report.mjs

      - name: Upload aggregate traffic report
        if: inputs.action == 'traffic-report'
        uses: actions/upload-artifact@v7
        with:
          name: traffic-report-${{ inputs.hostname }}-${{ github.run_id }}
          path: ${{ runner.temp }}/traffic-report
          if-no-files-found: error
          retention-days: 14

      # The CDP facilitator answers 401 to anonymous callers, so verify-rail.mjs
      # cannot check it from a developer machine — the credentials only exist as
      # repo secrets. Here they do, so this is the one place the CDP rail can be
      # verified end to end (key accepted + Base mainnet actually settled)
      # *before* real money is pointed at it.
      - name: Verify the CDP rail with its credentials
        if: inputs.action == 'verify-cdp'
        env:
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
        run: node scripts/verify-rail.mjs cdp

      # /api/stats.json needs Account Analytics: Read. The deploy token was made
      # from the "Edit Cloudflare Workers" template, which may already include it
      # — worth finding out before asking for a second token.
      - name: Probe whether the deploy token can read Analytics Engine
        if: inputs.action == 'stats-probe'
        run: |
          code=$(curl -s -o /tmp/probe.txt -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'content-type: text/plain' \
            --data "SELECT count() AS n FROM ai_product_index_requests WHERE timestamp > NOW() - INTERVAL '7' DAY")
          echo "HTTP $code"
          head -c 600 /tmp/probe.txt; echo
          if [ "$code" = "200" ]; then
            echo "::notice::the existing deploy token CAN read Analytics Engine — no second token needed"
          else
            echo "::notice::the deploy token cannot read Analytics Engine; create a token with Account Analytics: Read and set it as repo secret CF_ANALYTICS_TOKEN"
          fi

      # The workers.dev hostname is how the deployment can be exercised before
      # (or without) a custom domain, which needs zone-scoped permissions the
      # deploy token may not have.
      - name: Print the workers.dev subdomain
        if: inputs.action == 'subdomain'
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s); process.stdout.write(j.result?.subdomain ?? "");})')
          if [ -z "$sub" ]; then
            echo "::error::could not read the workers.dev subdomain"
            exit 1
          fi
          echo "::notice::WORKERS_DEV=https://ai-product-index.$sub.workers.dev"

      # Idempotent: an existing namespace is reported rather than duplicated,
      # so re-running this is safe and never orphans payment state.
      - name: Ensure the PAYMENTS KV namespace exists
        if: inputs.action == 'kv-setup'
        run: |
          set -o pipefail
          echo "--- existing namespaces ---"
          npx --yes wrangler@4 kv namespace list | tee /tmp/ns.json

          id=$(node -e '
            const list = JSON.parse(require("fs").readFileSync("/tmp/ns.json", "utf8"));
            const hit = list.find((n) => n.title === "PAYMENTS" || /(^|-)PAYMENTS$/.test(n.title));
            process.stdout.write(hit ? hit.id : "");
          ')

          if [ -n "$id" ]; then
            echo "::notice::PAYMENTS already exists"
          else
            echo "--- creating PAYMENTS ---"
            npx --yes wrangler@4 kv namespace create PAYMENTS | tee /tmp/create.log
            npx --yes wrangler@4 kv namespace list > /tmp/ns.json
            id=$(node -e '
              const list = JSON.parse(require("fs").readFileSync("/tmp/ns.json", "utf8"));
              const hit = list.find((n) => n.title === "PAYMENTS" || /(^|-)PAYMENTS$/.test(n.title));
              process.stdout.write(hit ? hit.id : "");
            ')
          fi

          if [ -z "$id" ]; then
            echo "::error::could not determine the PAYMENTS namespace id"
            exit 1
          fi

          # A namespace id is not a secret — it ships in the committed
          # wrangler.toml — so printing it here is how it gets back to the repo.
          echo "::notice::PAYMENTS_KV_NAMESPACE_ID=$id"
          echo "### PAYMENTS namespace id" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$id" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Attaching a hostname is a one-time zone-scoped operation (wrangler.toml
      # documents why it is not declared there: a zone grant the deploy lacks
      # must not be able to take the whole deploy down). This action does the
      # attach without the token ever leaving GitHub. Idempotent: re-attaching
      # an already-attached hostname succeeds.
      - name: Attach a custom domain to the Worker
        if: inputs.action == 'attach-domain'
        env:
          ATTACH_HOSTNAME: ${{ inputs.hostname }}
        run: |
          set -euo pipefail
          base=https://api.cloudflare.com/client/v4
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                       -H "Content-Type: application/json" "$@"; }
          host="${ATTACH_HOSTNAME:?the hostname input is required for attach-domain}"
          # The owning zone is the longest zone name that suffixes the hostname.
          zone=$(api "$base/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const r=JSON.parse(s);
              if(!r.success){ console.error(JSON.stringify(r.errors)); process.exit(1); }
              const host=process.argv[1];
              const hit=r.result
                .filter(z=>host===z.name||host.endsWith("."+z.name))
                .sort((a,b)=>b.name.length-a.name.length)[0];
              if(!hit){ console.error("no zone in this account owns "+host); process.exit(1); }
              console.log(hit.id);
            })' "$host")
          out=$(api -X PUT "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
                --data "{\"zone_id\":\"$zone\",\"hostname\":\"$host\",\"service\":\"ai-product-index\",\"environment\":\"production\"}")
          printf '%s\n' "$out" | head -c 800; echo
          ok=$(printf '%s' "$out" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try{ console.log(JSON.parse(s).success===true?"true":"false") }
              catch{ console.log("false") }})')
          if [ "$ok" != "true" ]; then
            echo "::error::attach failed for $host — if the error is code 10000, the token lacks zone-level Workers Routes / DNS rights for this zone; attach in the dashboard instead (Worker -> Settings -> Domains & Routes)"
            exit 1
          fi
          echo "::notice::attached $host to ai-product-index"

      # A repository can back multiple Cloudflare Pages projects. This creates a
      # focused static site from one directory while reusing an existing
      # project's private-GitHub connection. The operation is intentionally
      # create-only: an existing project must already match the requested source
      # and build configuration, so a typo cannot silently repoint a live site.
      - name: Create a Git-backed Pages project and attach its domain
        if: inputs.action == 'pages-setup'
        env:
          PAGES_HOSTNAME: ${{ inputs.hostname }}
          PAGES_PROJECT: ${{ inputs.project_name }}
          PAGES_SOURCE_PROJECT: ${{ inputs.source_project }}
          PAGES_ROOT_DIR: ${{ inputs.root_dir }}
        run: |
          set -euo pipefail
          base=https://api.cloudflare.com/client/v4
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                       -H "Content-Type: application/json" "$@"; }

          project="${PAGES_PROJECT:?project_name is required for pages-setup}"
          source_project="${PAGES_SOURCE_PROJECT:?source_project is required for pages-setup}"
          root_dir="${PAGES_ROOT_DIR:?root_dir is required for pages-setup}"
          hostname="${PAGES_HOSTNAME:?hostname is required for pages-setup}"

          api "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$source_project" \
            > /tmp/source-project.json
          SOURCE_PROJECT="$source_project" node <<'NODE'
          const fs = require("node:fs");
          const envelope = JSON.parse(fs.readFileSync("/tmp/source-project.json", "utf8"));
          if (!envelope.success || !envelope.result?.source) {
            console.error(`Could not read Git source from ${process.env.SOURCE_PROJECT}: ${JSON.stringify(envelope.errors || [])}`);
            process.exit(1);
          }
          NODE

          api "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project" \
            > /tmp/target-project.json
          exists=$(node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/target-project.json","utf8"));
            process.stdout.write(j.success && j.result ? "true" : "false");')

          if [ "$exists" != "true" ]; then
            PAGES_PROJECT="$project" PAGES_ROOT_DIR="$root_dir" \
              node > /tmp/create-pages-project.json <<'NODE'
          const fs = require("node:fs");
          const sourceEnvelope = JSON.parse(fs.readFileSync("/tmp/source-project.json", "utf8"));
          const source = structuredClone(sourceEnvelope.result.source);
          source.config = {
            ...source.config,
            deployments_enabled: true,
            path_excludes: [],
            path_includes: [`${process.env.PAGES_ROOT_DIR}/*`],
            pr_comments_enabled: false,
            preview_branch_excludes: [],
            preview_branch_includes: [],
            preview_deployment_setting: "none",
            production_branch: "main",
            production_deployments_enabled: true,
          };
          const body = {
            name: process.env.PAGES_PROJECT,
            production_branch: "main",
            build_config: {
              build_caching: false,
              build_command: "exit 0",
              destination_dir: ".",
              root_dir: process.env.PAGES_ROOT_DIR,
            },
            source,
          };
          process.stdout.write(JSON.stringify(body));
          NODE
            api -X POST "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              --data-binary @/tmp/create-pages-project.json > /tmp/target-project.json
          fi

          PAGES_PROJECT="$project" PAGES_SOURCE_PROJECT="$source_project" \
            PAGES_ROOT_DIR="$root_dir" node <<'NODE'
          const fs = require("node:fs");
          const envelope = JSON.parse(fs.readFileSync("/tmp/target-project.json", "utf8"));
          const sourceEnvelope = JSON.parse(fs.readFileSync("/tmp/source-project.json", "utf8"));
          if (!envelope.success || !envelope.result) {
            console.error(`Pages project setup failed: ${JSON.stringify(envelope.errors || [])}`);
            process.exit(1);
          }
          const project = envelope.result;
          const expectedSource = sourceEnvelope.result.source;
          const failures = [];
          if (project.name !== process.env.PAGES_PROJECT) failures.push("project name");
          if (project.source?.type !== expectedSource.type || project.source?.config?.repo_id !== expectedSource.config?.repo_id) failures.push("source repository");
          if (project.source?.config?.production_branch !== "main") failures.push("production branch");
          if (project.source?.config?.production_deployments_enabled !== true) failures.push("automatic production deployments");
          if (!project.source?.config?.path_includes?.includes(`${process.env.PAGES_ROOT_DIR}/*`)) failures.push("build watch path");
          if (project.build_config?.root_dir !== process.env.PAGES_ROOT_DIR) failures.push("root directory");
          if (project.build_config?.destination_dir !== ".") failures.push("destination directory");
          if (failures.length) {
            console.error(`Existing Pages project does not match: ${failures.join(", ")}`);
            process.exit(1);
          }
          console.log(`Pages project ready: ${project.name} (${project.subdomain})`);
          NODE

          api "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains/$hostname" \
            > /tmp/pages-domain.json
          domain_exists=$(node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/pages-domain.json","utf8"));
            process.stdout.write(j.success && j.result ? "true" : "false");')
          if [ "$domain_exists" != "true" ]; then
            HOSTNAME="$hostname" node -e '
              process.stdout.write(JSON.stringify({name: process.env.HOSTNAME}));' \
              > /tmp/create-pages-domain.json
            api -X POST \
              "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains" \
              --data-binary @/tmp/create-pages-domain.json > /tmp/pages-domain.json
          fi

          PAGES_HOSTNAME="$hostname" node <<'NODE'
          const fs = require("node:fs");
          const envelope = JSON.parse(fs.readFileSync("/tmp/pages-domain.json", "utf8"));
          if (!envelope.success || !envelope.result) {
            console.error(`Pages domain setup failed: ${JSON.stringify(envelope.errors || [])}`);
            process.exit(1);
          }
          if (envelope.result.name !== process.env.PAGES_HOSTNAME) {
            console.error(`Cloudflare returned unexpected domain ${envelope.result.name}`);
            process.exit(1);
          }
          console.log(`Pages domain ${envelope.result.name}: ${envelope.result.status}`);
          NODE

          pages_target=$(node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/target-project.json","utf8"));
            process.stdout.write(j.result.subdomain);')
          zones=$(api "$base/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50")
          zone=$(printf '%s' "$zones" | HOSTNAME="$hostname" node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const r=JSON.parse(s);
              if(!r.success){ console.error(`Could not list DNS zones: ${JSON.stringify(r.errors||[])}`); process.exit(1); }
              const host=process.env.HOSTNAME;
              const hit=r.result
                .filter(z=>host===z.name||host.endsWith("."+z.name))
                .sort((a,b)=>b.name.length-a.name.length)[0];
              if(!hit){ console.error(`No Cloudflare zone owns ${host}`); process.exit(1); }
              process.stdout.write(hit.id);
            });')

          api "$base/zones/$zone/dns_records?type=CNAME&name=$hostname" \
            > /tmp/pages-dns.json
          dns_access=$(node -e '
            const j=JSON.parse(require("fs").readFileSync("/tmp/pages-dns.json","utf8"));
            if(j.success) process.stdout.write("available");
            else if((j.errors||[]).some(e=>e.code===10000)) process.stdout.write("manual");
            else {
              console.error(`Could not read Pages DNS: ${JSON.stringify(j.errors||[])}`);
              process.exit(1);
            }')
          if [ "$dns_access" = "manual" ]; then
            echo "::warning::The token has no DNS permission. Add proxied CNAME $hostname -> $pages_target in the Cloudflare dashboard."
          else
            dns_state=$(
              DNS_HOSTNAME="$hostname" DNS_TARGET="$pages_target" node <<'NODE'
          const fs = require("node:fs");
          const envelope = JSON.parse(fs.readFileSync("/tmp/pages-dns.json", "utf8"));
          const records = envelope.result || [];
          if (records.length > 1 || (records[0] && records[0].content !== process.env.DNS_TARGET)) {
            console.error(`Refusing to replace a conflicting DNS record for ${process.env.DNS_HOSTNAME}`);
            process.exit(1);
          }
          process.stdout.write(records.length === 1 ? "exists" : "missing");
          NODE
            )
            if [ "$dns_state" = "missing" ]; then
              DNS_HOSTNAME="$hostname" DNS_TARGET="$pages_target" node -e '
                process.stdout.write(JSON.stringify({
                  type: "CNAME",
                  name: process.env.DNS_HOSTNAME,
                  content: process.env.DNS_TARGET,
                  proxied: true,
                  ttl: 1,
                }));' > /tmp/create-pages-dns.json
              api -X POST "$base/zones/$zone/dns_records" \
                --data-binary @/tmp/create-pages-dns.json > /tmp/pages-dns.json
              DNS_HOSTNAME="$hostname" DNS_TARGET="$pages_target" node <<'NODE'
          const fs = require("node:fs");
          const envelope = JSON.parse(fs.readFileSync("/tmp/pages-dns.json", "utf8"));
          if (!envelope.success || envelope.result?.type !== "CNAME" || envelope.result?.name !== process.env.DNS_HOSTNAME || envelope.result?.content !== process.env.DNS_TARGET) {
            console.error(`Pages DNS creation failed: ${JSON.stringify(envelope.errors || [])}`);
            process.exit(1);
          }
          NODE
            fi
            echo "Pages DNS ready: $hostname -> $pages_target"
          fi

          {
            echo "### Cloudflare Pages project"
            echo
            echo "- Project: \`$project\`"
            echo "- Git source: \`$source_project\`"
            echo "- Published root: \`$root_dir\`"
            echo "- Build watch path: \`$root_dir/*\`"
            echo "- Domain: \`$hostname\`"
            echo "- DNS target: \`$pages_target\`"
            echo "- DNS management: \`$dns_access\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Managed robots.txt / AI-crawler blocking.
      #
      # Cloudflare can prepend a managed block to a zone's robots.txt that
      # Disallows the AI crawlers (ClaudeBot, GPTBot, CCBot, Google-Extended,
      # Amazonbot and friends). It is injected at the edge *above* whatever the
      # origin serves, so a repo's own `Allow: /` cannot override it and editing
      # robots.txt in git changes nothing at all.
      #
      # `robots-report` only reads. `robots-allow` is the one that writes, and it
      # is a separate action precisely so that inspecting the current state can
      # never change it by accident.
      # ---------------------------------------------------------------------
      - name: robots-report / robots-allow
        if: inputs.action == 'robots-report' || inputs.action == 'robots-allow'
        env:
          APPLY: ${{ inputs.action == 'robots-allow' && '1' || '' }}
        run: |
          set -euo pipefail
          base=https://api.cloudflare.com/client/v4
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                       -H "Content-Type: application/json" "$@"; }
          # Reads one field out of an API envelope on stdin: envelope-level keys
          # (`success`) first, then the `result` body. Keeps jq out of it, and
          # keeps the token off any command line.
          field() { node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              let r; try{ r=JSON.parse(s) }catch{ console.log(""); return }
              const k=process.argv[1];
              const v=(r && k in r) ? r[k] : ((r && r.result) || {})[k];
              console.log(v===undefined||v===null?"-":String(v));
            })' "$1"; }

          zones=$(api "$base/zones?account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const r=JSON.parse(s);
              if(!r.success){ console.error(JSON.stringify(r.errors)); process.exit(1); }
              for(const z of r.result) console.log(z.id+" "+z.name);
            })')

          {
            echo "### Managed robots.txt by zone"
            echo
            echo "| zone | is_robots_txt_managed | cf_robots_variant | ai_bots_protection |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          changed=0
          while read -r id name; do
            [ -n "${id:-}" ] || continue
            cfg=$(api "$base/zones/$id/bot_management")
            managed=$(printf '%s' "$cfg" | field is_robots_txt_managed)
            variant=$(printf '%s' "$cfg" | field cf_robots_variant)
            aibots=$(printf '%s' "$cfg" | field ai_bots_protection)
            # A bot_management body carries no secrets, so when a field is
            # missing the envelope itself is the diagnosis — usually a token
            # that cannot read this zone, not a zone with the feature off.
            if [ "$managed" = "-" ]; then
              echo "  raw GET envelope for $name:"
              printf '%s\n' "$cfg" | head -c 600
              echo
            fi
            echo "| $name | $managed | $variant | $aibots |" >> "$GITHUB_STEP_SUMMARY"
            echo "zone $name: managed=$managed variant=$variant ai_bots=$aibots"

            if [ -n "$APPLY" ] && { [ "$managed" = "true" ] || [ "$aibots" = "block" ]; }; then
              # policy_only keeps Cloudflare's Content Signals Policy — the
              # Article 4 reservation — while dropping the AI-crawler Disallow
              # rules, so agents may read the site and the training preference
              # stays declared. If a zone's plan will not take the variant, fall
              # back to switching the managed file off outright.
              out=$(api -X PUT "$base/zones/$id/bot_management" \
                    --data '{"is_robots_txt_managed":true,"cf_robots_variant":"policy_only","ai_bots_protection":"disabled"}') || true
              ok=$(printf '%s' "$out" | field success)
              if [ "$ok" != "true" ]; then
                echo "  policy_only rejected; falling back to is_robots_txt_managed=false"
                out=$(api -X PUT "$base/zones/$id/bot_management" \
                      --data '{"is_robots_txt_managed":false,"ai_bots_protection":"disabled"}')
                ok=$(printf '%s' "$out" | field success)
              fi
              if [ "$ok" = "true" ]; then
                echo "  -> updated $name"; changed=$((changed+1))
              else
                echo "::error::failed to update $name"
                printf '%s\n' "$out" | head -c 800
                exit 1
              fi
            fi
          done <<< "$zones"

          if [ -n "$APPLY" ]; then
            echo "::notice::updated $changed zone(s)"
          else
            echo "::notice::report only — nothing was changed"
          fi
