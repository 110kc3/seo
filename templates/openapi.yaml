openapi: 3.1.0
info:
  title: AI Product Index — read API
  version: 1.0.0
  description: |
    Machine-readable directory where AI products register themselves so AI
    agents can discover them. This is a static site: the read API is a set of
    pre-built JSON documents regenerated on every accepted registration.

    WRITE PATHS (autonomous, via GitHub issues on https://github.com/{{REPO}}):
    "[register] ..." = new listing, "[update] ..." = full replacement by the
    original submitter, "[upgrade] ..." = paid tier change with on-chain receipt
    verification. Bodies are JSON conforming to {{BASE}}/api/schema.json.
    Full protocol: {{BASE}}/llms.txt · MCP server: mcp/server.mjs in the repo.

    HEALTH: listing URLs are re-checked weekly; 3 consecutive failures delist
    (strike state at {{BASE}}/health.json).

    AUDIT: GET /api/score?url=... is free and returns an A-F grade plus per-check
    pass/fail. POST /api/audit is the paid half — the same checks, plus why each
    one failed, fixes ranked by weight, and a paste-ready code snippet per
    failure. Priced per call over x402, and both protocol versions are accepted:
    v2 (PAYMENT-REQUIRED / PAYMENT-SIGNATURE / PAYMENT-RESPONSE) and v1
    (X-PAYMENT / X-PAYMENT-RESPONSE), so clients on either spec can pay.

    TIERS: verified and featured exist in the schema and index ranking; the tier
    field is server-set, so the read API does not change shape when prices
    change. Current machine-payment terms are published at /api/x402/info.
  contact:
    url: https://github.com/{{REPO}}
servers:
  - url: {{BASE}}
paths:
  /api/search:
    get:
      operationId: searchListings
      summary: Search the registry
      description: >-
        Ranked search over every listing. Matches on name, tags, slug and
        description, weighted in that order, with whole-word hits beating
        substrings. A query that matches nothing returns what the corpus does
        contain, so the next query can be narrowed rather than guessed.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
          description: Free text. Omit to list everything (subject to limit).
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [api, app, agent, mcp, other] }
        - name: tag
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Matching listings, best first.
          content:
            application/json:
              schema:
                type: object
                required: [ok, query, total, count, results]
                properties:
                  ok: { type: boolean }
                  query: { type: string }
                  total: { type: integer, description: Matches before the limit was applied. }
                  count: { type: integer }
                  results: { type: array, items: { type: object } }
  /ask:
    post:
      operationId: askNlweb
      summary: Ask the index a question in natural language (NLWeb)
      description: >-
        NLWeb (nlweb.ai) natural-language query. The answer is a list of
        schema.org objects under `results`, grounded only in this registry —
        nothing is generated. GET /ask?query=... is accepted for convenience.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  properties:
                    text: { type: string, description: The question. }
                    site: { type: string, description: Corpus to query; this endpoint serves one. }
                prefer:
                  type: object
                  properties:
                    mode: { type: string, enum: [list, summarize], default: summarize }
            example: { query: { text: free MCP servers } }
      responses:
        "200":
          description: >-
            An answer, or an elicitation when the question was empty.
          content:
            application/json:
              schema:
                type: object
                required: [_meta, results]
                properties:
                  _meta:
                    type: object
                    properties:
                      response_type: { type: string, enum: [answer, elicitation, failure] }
                      version: { type: string }
                  results:
                    type: array
                    items: { type: object, description: A schema.org object. }
                  summary: { type: string, description: One-sentence answer. Present by default; send mode=list to omit it. }
  /mcp:
    post:
      operationId: mcpRpc
      summary: Model Context Protocol over streamable HTTP
      description: >-
        JSON-RPC 2.0. Methods: initialize, ping, tools/list, tools/call.
        Tools: search_products, get_product, score_url, how_to_register.
        No authentication and nothing to install — any MCP client that accepts
        a URL can use this index as a tool source. Server card at
        /.well-known/mcp.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ["2.0"] }
                id: { type: [string, integer, "null"] }
                method: { type: string }
                params: { type: object }
            example: { jsonrpc: "2.0", id: 1, method: tools/list }
      responses:
        "200":
          description: A JSON-RPC result or error.
          content:
            application/json: {}
        "202":
          description: Accepted — the message was a notification, so there is no reply.
  /api/index.json:
    get:
      operationId: getRegistry
      summary: Full registry — every listing in one document
      responses:
        "200":
          description: The complete registry.
          content:
            application/json:
              schema:
                type: object
                required: [count, updated, listings]
                properties:
                  count:
                    type: integer
                  updated:
                    type: [string, "null"]
                    description: Date (YYYY-MM-DD) of the most recent listing.
                  listings:
                    type: array
                    items:
                      $ref: "{{BASE}}/api/schema.json"
  /api/schema.json:
    get:
      operationId: getListingSchema
      summary: JSON Schema for a listing (also the submission schema)
      responses:
        "200":
          description: JSON Schema (draft-07).
          content:
            application/json: {}
  /listings/{slug}.json:
    get:
      operationId: getListing
      summary: One listing
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$"
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema:
                $ref: "{{BASE}}/api/schema.json"
        "404":
          description: Unknown slug.
  /llms-full.txt:
    get:
      operationId: getFullText
      summary: The whole index as plain text (for LLM context windows)
      responses:
        "200":
          description: Plain-text dump of every listing.
          content:
            text/plain: {}
  /api/stats.json:
    get:
      operationId: getStats
      summary: Traffic stats for this index over a 30-day window
      description: |
        Aggregated request counts by inferred client type (ai_agent, ai_crawler,
        browser, script, ...) and by path bucket, plus agent_share. Client type is
        inferred from the self-reported user-agent; no IP addresses or other
        personal data are collected.
      responses:
        "200":
          description: Aggregated counters.
          content:
            application/json: {}
        "503":
          description: Stats not published yet (code stats_not_enabled).
  /api/x402/info:
    get:
      operationId: getPaymentTerms
      summary: Payment terms for the paid endpoint, without provoking a 402
      description: |
        Returns the active rail's network, asset, price in atomic units, payTo
        address and the x402 protocol versions accepted. Everything here also
        appears in the 402 challenge — this just saves a wasted request.
      responses:
        "200":
          description: Active payment terms.
          content:
            application/json: {}
        "503":
          description: Rail not configured (code payments_not_enabled).
  /api/score:
    get:
      operationId: getFreeScore
      summary: Agent-readability score (free, no payment)
      description: |
        Returns an A-F letter grade, the numeric score out of 100, and every
        check with a label and pass/fail — the verdict, free and without signup.

        It deliberately omits what POST /api/audit sells: the per-check reason for
        failure, fixes ranked by weight, and a paste-ready code snippet for each
        failing check.

        The response carries `check_set`, naming the checklist that produced the
        grade. `v2` (the default) scores 20 checks: the 13 established ones plus
        seven 2026 agent-readiness surfaces — Content Signals, the A2A 1.0 card
        path, an MCP server card, an RFC 9727 API catalog, an Agent Skills index,
        markdown content negotiation and a Web Bot Auth directory. Every one of
        those carries less weight than the cheapest 2025 check, because adoption
        is still under 15% and missing one is normal rather than negligent.
        `v1` scores only the original 13, and is kept so a grade published
        earlier stays reproducible.

        Results are cached per URL *and check set* for an hour and a cached
        answer is unmetered; uncached audits are limited to 20/hour/IP because
        each fetches the target. Private, loopback and link-local targets are
        refused, same as the paid path.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
            pattern: "^https?://"
          description: Public http(s) URL to score.
        - name: checks
          in: query
          required: false
          schema:
            type: string
            enum: [v1, v2]
            default: v2
          description: >
            Which checklist to score against. Omit for the current default. An
            unrecognised value is normalised to the default rather than refused.
      responses:
        "200":
          description: The score.
          content:
            application/json: {}
        "400":
          description: Missing or rejected url.
        "429":
          description: Rate limited (code rate_limited).
        "502":
          description: The target site could not be read.
  /api/audit:
    post:
      operationId: auditUrl
      summary: Agent-readability audit of one URL (paid, x402)
      description: |
        Scores how readable a site is to AI agents across the current 20-check
        set: 13 established web signals plus seven lower-weight 2026 discovery
        surfaces. Returns per-check detail and ranked next_steps.

        Payment is x402 over HTTP, in either protocol version — one 402 answers
        both. v2 clients read the base64 PAYMENT-REQUIRED header, retry with
        PAYMENT-SIGNATURE, and get the receipt in PAYMENT-RESPONSE. v1 clients
        read the same 402's JSON body (v1 field names: maxAmountRequired, a
        network name, a flat resource URL), retry with X-PAYMENT, and get the
        receipt in X-PAYMENT-RESPONSE. The target URL is validated before any
        charge, so a request that would be rejected is never billed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  pattern: "^https?://"
                  description: Public http(s) URL to audit. Private and local hosts are rejected.
      responses:
        "200":
          description: The audit. PAYMENT-RESPONSE header carries the settlement receipt.
          content:
            application/json:
              schema:
                type: object
                required: [ok, url, score, max_score, grade, checks]
                properties:
                  ok: { type: boolean }
                  url: { type: string }
                  audited_at: { type: string, format: date-time }
                  score: { type: integer }
                  max_score: { type: integer }
                  grade: { type: string }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        weight: { type: integer }
                        pass: { type: boolean }
                        detail: { type: string }
                        fix: { type: string }
                  next_steps:
                    type: array
                    items: { type: string }
        "400":
          description: Invalid JSON, invalid target URL, or malformed payment payload.
        "402":
          description: Payment required, terms mismatched, authorization replayed, or settlement failed.
        "413":
          description: Body too large.
        "502":
          description: Target unreachable, or the payment facilitator did not respond.
        "503":
          description: Payment rails not configured (code payments_not_enabled).

  /api/liveness:
    # Path-level override: the Router answers on its own hostname once one is
    # attached, and the canonical host 308s here. While unattached this equals
    # the top-level server, so the document is correct in both states.
    servers:
      - url: {{ROUTER}}
    get:
      operationId: probeEndpoint
      summary: Is this machine-payable endpoint alive, and what does it charge? (paid, x402)
      description: |
        Probes one endpoint right now and reports whether it answered, how fast,
        and the payment terms it currently quotes — read from its own 402, in
        either x402 version.

        What is sold here is freshness. The catalogs and their weekly liveness
        aggregates are free and stay free; what nothing else publishes is whether
        an endpoint answers *at this moment*, since the Bazaar keeps an entry for
        30 days after its last settlement.

        This service never pays and never proxies. The probe is an unpaid
        request, which is exactly why it works: a paid endpoint answers it with a
        402, and a 402 states its terms. You then pay that endpoint directly,
        from your own wallet. No funds are held, forwarded or fronted here, and
        no key capable of signing a transfer exists in this deployment.

        `alive` means the host answered with any HTTP response — a 402 is the
        successful outcome, and so is a 405 from probing a POST-only endpoint.
        A 200 from an unpaid probe of a paid endpoint would mean its paywall is
        broken, which is also worth knowing.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri, pattern: "^https?://" }
          description: Public http(s) endpoint to probe. Private and local hosts are rejected, before any charge.
        - name: method
          in: query
          required: false
          schema: { type: string, enum: [GET, POST], default: GET }
      responses:
        "200":
          description: The probe result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  settlement:
                    type: string
                    description: Restates that you pay the endpoint directly and that this service holds no funds.
                  result:
                    type: object
                    properties:
                      url: { type: string }
                      alive: { type: boolean, description: The host answered with an HTTP response of any status. }
                      status: { type: integer, description: 0 when nothing answered. }
                      latency_ms: { type: integer }
                      paywalled: { type: boolean, description: Answered 402. }
                      cached: { type: boolean, description: Present when served from the 60-second shared probe cache. }
                      source: { type: string, description: '"self" when the target is one of this service''s own hosts, answered from configuration rather than fetched.' }
                      history:
                        type: object
                        nullable: true
                        description: |
                          What this endpoint has done over time. Null for this
                          service's own hosts, which are answered from
                          configuration rather than probed.

                          Observations come from live probes — this one and every
                          earlier one — so a record deepens as an endpoint is
                          asked about. Cache hits are not observations. The
                          weekly catalog cron is a separate and much coarser
                          instrument: it walks a rotating slice, so it sees any
                          given endpoint about twice a year.
                        properties:
                          first_seen: { type: string, format: date-time }
                          probes: { type: integer, description: Total observations recorded. }
                          answered: { type: integer }
                          uptime:
                            type: number
                            nullable: true
                            description: answered/probes. Null below 3 observations — "1 of 1" is a ratio that invites a conclusion it cannot support.
                          recent:
                            type: object
                            description: The last 30 observations, so "answered 29 of the last 30" is directly readable.
                            properties:
                              answered: { type: integer }
                              of: { type: integer }
                          consecutive_failures: { type: integer, description: How many of the most recent probes in a row did not answer. }
                          last_answered: { type: string, format: date-time, nullable: true }
                          last_probed: { type: string, format: date-time }
                          note: { type: string, description: Present while the record is too thin to read as a rate. }
                      terms:
                        type: array
                        nullable: true
                        description: Terms parsed from the endpoint's 402, one entry per accepted option. Null when it quoted none we could read.
                        items:
                          type: object
                          properties:
                            scheme: { type: string }
                            network: { type: string }
                            asset: { type: string }
                            asset_name: { type: string }
                            pay_to: { type: string }
                            amount_atomic: { type: string, description: Exactly what the endpoint said. Always present. }
                            price:
                              type: number
                              nullable: true
                              description: Human units. Null when the asset's decimals are not known — a guessed divisor is how $0.05 gets read as $50.
                            price_decimals: { type: integer, nullable: true }
                            max_timeout_seconds: { type: integer, nullable: true }
        "400":
          description: Missing or invalid url, or an unsupported method. Refused before any charge.
        "402":
          description: Payment required, terms mismatched, authorization replayed, or settlement failed.
        "405":
          description: Method not allowed — this endpoint is GET.
        "503":
          description: Payment rails not configured (code payments_not_enabled).

  /api/route:
    servers:
      - url: {{ROUTER}}
    post:
      operationId: routeToEndpoint
      summary: Which machine-payable endpoint should I call for this? (paid, x402)
      description: |
        Ranks candidate endpoints from the x402 catalog for a described task,
        probes each one live, and returns the terms each currently quotes
        alongside the URL to call.

        Ordering is: endpoints that answered first, then the cheapest live quote,
        then the catalog's own relevance ranking. Endpoints that did not answer
        are reported rather than dropped — you asked what exists, and hiding the
        dead ones would misrepresent the state of the network you are trying to
        use.

        A query that matches nothing in the catalog is **not charged for**.

        As with /api/liveness: nothing is proxied and nothing is paid on your
        behalf. You receive URLs and terms, and you pay those endpoints directly,
        so the operator you pay sees you rather than us.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q:
                  type: string
                  description: What the endpoint should do, e.g. "currency conversion".
                max_price:
                  type: number
                  description: Upper bound in USDC. An endpoint with no published price is excluded — an unknown price is not a low one.
                chain:
                  type: string
                  description: e.g. base, base-sepolia.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                  description: How many candidates to probe. Capped, because each one is a request sent to somebody else's server.
      responses:
        "200":
          description: Ranked, probed candidates. May be an empty list, which is free.
          content:
            application/json:
              schema:
                type: object
                required: [ok, query, count]
                properties:
                  ok: { type: boolean }
                  query: { type: string }
                  count: { type: integer }
                  settlement: { type: string }
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        host: { type: string }
                        description: { type: string }
                        catalog_price: { type: number, description: What the catalog last recorded. Compare with probe.terms for what it quotes now. }
                        chain: { type: string }
                        method: { type: string }
                        probe:
                          type: object
                          description: Same shape as the result of /api/liveness.
        "400":
          description: Invalid JSON or a missing q. Refused before any charge.
        "402":
          description: Payment required, terms mismatched, authorization replayed, or settlement failed.
        "405":
          description: Method not allowed — this endpoint is POST.
        "413":
          description: Body too large.
        "503":
          description: Catalog unavailable, or payment rails not configured.

  /api/watch:
    servers:
      - url: {{ROUTER}}
    post:
      operationId: watchEndpoint
      summary: Prepay weekly endpoint monitoring with state-change webhooks (paid, x402)
      description: |
        Buys 4–52 weekly sweeps of one public endpoint. Each sweep spends one
        prepaid credit; nothing is charged later without a new signed payment.
        The payer address from settlement owns the watch, so there is no account.

        The first sweep establishes a baseline. Later webhooks fire only when the
        endpoint changes from answering to failing or back again, and once when
        credits are exhausted. Paying again for the same URL from the same wallet
        adds credits and may update the webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, webhook, sweeps]
              properties:
                url:
                  type: string
                  format: uri
                  pattern: "^https?://"
                  description: Public endpoint to monitor; private and local hosts are rejected before charging.
                webhook:
                  type: string
                  format: uri
                  pattern: "^https://"
                  description: Public HTTPS destination for state-change alerts.
                sweeps:
                  type: integer
                  minimum: 4
                  maximum: 52
                  default: 12
                  description: Weekly sweeps to prepay.
      responses:
        "200":
          description: Watch created or topped up; PAYMENT-RESPONSE carries the settlement receipt.
          content:
            application/json:
              schema:
                type: object
                required: [ok, watching, webhook, credits, owner, cadence]
                properties:
                  ok: { type: boolean }
                  watching: { type: string, format: uri }
                  webhook: { type: string, format: uri }
                  credits: { type: integer }
                  topped_up: { type: boolean }
                  owner: { type: string, description: Payer address derived from settlement. }
                  cadence: { type: string, enum: [weekly] }
                  alerts_on: { type: string }
                  payload: { type: object, description: Example webhook payload shape. }
                  note: { type: string }
                  terms: { type: string, format: uri }
        "400":
          description: Invalid JSON, URL, webhook, or sweep count. Refused before charging.
        "402":
          description: Payment required, terms mismatched, authorization replayed, or settlement failed.
        "405":
          description: Method not allowed — this endpoint is POST.
        "413":
          description: Body too large.
        "502":
          description: Settlement did not identify a payer.
        "503":
          description: Payment rail unavailable, or payment settled but the watch could not be stored.
