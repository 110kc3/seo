# Cloudflare Workers deployment for the AI Product Index.
#
# Workers-with-static-assets (not Pages, not the deprecated Workers Sites):
# one deployment serves the committed static build AND the dynamic routes
# that GitHub Pages could never serve — HTTP 402 payment gating, custom
# response headers, and per-request logging.
#
# The static build in the repo root is the asset directory; .assetsignore
# keeps source, tooling and docs out of the upload.
name = "ai-product-index"
main = "worker/index.js"
compatibility_date = "2026-07-01"

# A workers.dev hostname, so there is always a URL that exercises the real edge
# independently of DNS: https://ai-product-index.110kc3.workers.dev
# Nothing canonical points at it — every published URL comes from
# site.config.json → base.
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
# Unknown paths render the generated 404.html rather than a Cloudflare error.
not_found_handling = "404-page"
# The Worker sees every request — required for measurement and for the
# response headers static hosting cannot set. It falls through to ASSETS
# for anything that is not a dynamic route.
run_worker_first = true

# The custom domain is NOT declared here, deliberately.
#
# `wrangler deploy` applies triggers after uploading the script, and attaching
# index.kc-it.pl is a zone-scoped operation:
#     /zones/<kc-it.pl>/workers/routes → Authentication error [code: 10000]
# The deploy token is account-scoped, so that call failed on every attempt *after*
# the Worker itself had uploaded fine — and because triggers are applied as one
# phase, it also stopped workers.dev from being enabled. One missing zone grant
# took down the whole deployment.
#
# Keeping the hostname out of here means CI needs no zone permissions at all
# (least privilege), and a custom domain attached once — in the dashboard under
# the Worker's Settings → Domains & Routes, or by a token with kc-it.pl in its
# Zone Resources — persists across every later deploy.
#
# To move it back into code: add kc-it.pl to the token's Zone Resources, then
# restore:
#   [[routes]]
#   pattern = "index.kc-it.pl"
#   custom_domain = true

# Settled x402 payment nonces (replay protection), the revenue ledger and the
# stats cache. Created 2026-07-25 via `gh workflow run cf-admin -f action=kv-setup`.
# A namespace id is an identifier, not a credential — it is safe in this file.
[[kv_namespaces]]
binding = "PAYMENTS"
id = "abdc346d8f1c428ead3a38f3b2a9e744"

# Per-request telemetry. Free tier; no IPs or other PII are written.
#
# COMMENTED OUT 2026-07-25 — not a design change, a one-click account blocker.
# The first deploy failed with:
#     You need to enable Analytics Engine [code: 10089]
#     https://dash.cloudflare.com/<account-id>/workers/analytics-engine
# Analytics Engine is an account-level opt-in that an API token cannot flip, and
# the whole site was blocked behind it. Dropping the binding is safe: `record()`
# in worker/index.js returns early when env.ANALYTICS is absent, and
# /api/stats.json already fails closed on its own missing secrets — so nothing
# errors, there is simply no telemetry.
#
# TO RESTORE (this is the measurement the migration existed for — do it):
#   1. Click the link above and enable Analytics Engine.
#   2. Uncomment the three lines below, commit, push.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "ai_product_index_requests"

[observability]
enabled = true
